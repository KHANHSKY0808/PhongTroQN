name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "upgrade/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: PHP ${{ matrix.php-version }} Lint & Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, fileinfo, gd
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP Syntax Check (Lint)
        run: |
          find app config database public tests -name "*.php" -print0 | xargs -0 -n 1 -P 4 php -l

      - name: Run PHPUnit Test Suite
        run: vendor/bin/phpunit --colors=always

